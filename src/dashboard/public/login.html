<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fins Trade — Login</title>
<style>
  :root { --bg:#0b0d10; --surface:#14171c; --line:#262b33; --ink:#e8ecef; --muted:#8a919c; --accent:#5fe3a3; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, system-ui, sans-serif; }
  form { width:320px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.tag { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f1216; color:var(--ink); font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:20px; padding:11px; border-radius:8px; border:none; background:var(--accent); color:#06140d; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { opacity:.9; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; display:none; }
</style>
</head>
<body>
<form method="POST" action="/login">
  <h1>Fins Trade</h1>
  <p class="tag">Masuk untuk membuka cockpit</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required />
  <button type="submit">Masuk</button>
  <div class="err" id="err">Username atau password salah.</div>
</form>
<script>
  if (new URLSearchParams(location.search).get('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
